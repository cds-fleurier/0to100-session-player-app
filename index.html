<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coach Session Player</title>
    <link rel="stylesheet" href="styles.css?v=1.30.0" />
  </head>
  <body>
    <main class="app">
      <section class="hero">
        <img
          class="brand-logo"
          src="https://0-to-100.gs-paths.fr/wp-content/uploads/2025/02/0-to-100-Logo-Bleu-RVB.png"
          alt="Logo 0 to 100"
        />
      </section>

      <section class="card input-card">
        <h1>0 to 100 Session Player</h1>
        <p>Choisis une séance 0 to 100, ou colle ta séance brute depuis Nolio.</p>

        <div class="field">
          <label class="field-label" for="sessionPicker">Séance</label>
          <select id="sessionPicker" class="field-select">
            <option value="" selected>Coller depuis Nolio</option>
          </select>
        </div>
        <div id="sessionOptions" class="session-options"></div>

        <div class="nolio-input">
          <textarea
            id="sessionInput"
            rows="12"
            spellcheck="false"
            placeholder="Colle ta session ici"
          ></textarea>
          <div class="input-actions">
            <button id="parseBtn">Générer la séance</button>
            <button id="pasteNolioBtn" class="secondary-btn">Coller depuis Nolio</button>
          </div>
        </div>
        <p id="parseStatus" class="status"></p>

        <div class="settings">
          <div class="settings-title">Réglages</div>
          <label class="setting-row">
            <span>Alertes vocales</span>
            <input type="checkbox" id="voiceToggle" checked />
          </label>
          <label class="setting-row" for="voiceMode">
            <span>Voix</span>
            <select id="voiceMode" class="voice-picker">
              <option value="female" selected>Femme</option>
              <option value="male">Homme</option>
            </select>
          </label>
          <label class="setting-row" for="metronomeMode">
            <span>Métronome · 180 BPM</span>
            <select id="metronomeMode" class="voice-picker">
              <option value="off" selected>Off</option>
              <option value="cadence">Passages cadence</option>
              <option value="run">Toute la course</option>
            </select>
          </label>
          <p id="metronomeHint" class="setting-hint" hidden></p>
          <label class="setting-row" for="musicPlatform">
            <span>Écouter sur<small class="setting-sub">Morceaux des tabatas en musique</small></span>
            <select id="musicPlatform" class="voice-picker">
              <option value="spotify" selected>Spotify</option>
              <option value="apple">Apple Music</option>
              <option value="youtube">YouTube</option>
              <option value="deezer">Deezer</option>
            </select>
          </label>
          <label class="setting-row">
            <span>Sonner en mode silencieux<small class="setting-sub">Coupe la musique des autres apps (iPhone)</small></span>
            <input type="checkbox" id="silentSwitchToggle" />
          </label>
        </div>
      </section>

      <section class="card plan-card">
        <h2>Plan</h2>
        <div id="sessionMeta" class="meta"></div>
        <ol id="exerciseList"></ol>
      </section>

      <section class="card videos-card">
        <h2>Vidéos des exercices</h2>
        <div class="video-scope" role="radiogroup" aria-label="Vidéos à afficher">
          <label class="video-scope-option">
            <input type="radio" name="videoScope" value="session" checked />
            <span>Voir les exercices de cette séance</span>
          </label>
          <label class="video-scope-option">
            <input type="radio" name="videoScope" value="all" />
            <span>Voir tous les exercices</span>
          </label>
        </div>
        <div id="videoList" class="video-list"></div>
        <p id="videoCount" class="video-count"></p>
      </section>

      <section class="card player-card">
        <h2>Player</h2>
        <div class="phase" id="phaseLabel">Pret</div>
        <div class="countdown" id="countdown">00</div>
        <div class="now" id="currentLabel">Charge une séance</div>
        <div class="next" id="nextLabel"></div>
        <button id="videoBtn" class="secondary-btn video-btn" hidden></button>
        <a id="checkpointMusic" class="music-btn checkpoint-music" target="_blank" rel="noopener" hidden></a>

        <div class="controls">
          <button id="startBtn" class="action-btn" disabled><span class="btn-icon">&#9654;</span>Demarrer</button>
          <button id="pauseBtn" class="action-btn" disabled><span class="btn-icon">&#9208;</span>Pause</button>
          <button id="resetBtn" class="action-btn" disabled><span class="btn-icon">&#9209;</span>Reset</button>
          <button id="skipBlockBtn" class="action-btn"><span class="btn-icon">&#9193;</span>FWD</button>
        </div>
        <div class="controls utility-controls">
          <button id="focusModeBtn" class="secondary-btn">Mode focus</button>
          <button id="wakeLockBtn" class="secondary-btn">Écran actif: off</button>
        </div>
        <p id="wakeLockHint" class="setting-hint" hidden></p>
        <div id="appVersion" class="app-version">v1.5.0</div>
      </section>
    </main>

    <div id="videoOverlay" class="video-overlay" hidden>
      <div class="video-sheet" role="dialog" aria-modal="true" aria-labelledby="videoTitle">
        <div class="video-head">
          <span id="videoTitle" class="video-title"></span>
          <button id="videoClose" class="video-close" aria-label="Fermer la vidéo">✕</button>
        </div>
        <div id="videoTabs" class="video-tabs"></div>
        <div id="videoFrame" class="video-frame"></div>
        <div class="video-foot">
          <span id="videoPauseNote" class="video-note"></span>
          <a id="videoExternal" class="video-external" target="_blank" rel="noopener">Ouvrir ailleurs</a>
        </div>
      </div>
    </div>

    <script src="sessions-library.js?v=1.30.0"></script>
    <script src="videos.js?v=1.30.0"></script>
    <script src="voice/manifest.js?v=1.30.0"></script>
    <script src="script.js?v=1.30.0"></script>
    <!-- Barre d'onglets partagée de la team (hub) -->
    <script src="https://cds-fleurier.github.io/0to100-hub/nav.js" defer></script>
  </body>
</html>
