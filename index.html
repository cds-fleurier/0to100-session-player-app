<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coach Session Player</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <section class="hero">
        <img
          class="brand-logo"
          src="https://0-to-100.gs-paths.fr/wp-content/uploads/2025/02/0-to-100-Logo-Bleu-RVB.png"
          alt="Logo 0 to 100"
        />
      </section>

      <section class="card input-card">
        <h1>0 to 100 Session Player</h1>
        <p>Choisis une séance 0 to 100, ou colle ta séance brute depuis Nolio.</p>

        <div class="field">
          <label class="field-label" for="sessionPicker">Séance</label>
          <select id="sessionPicker" class="field-select">
            <option value="" selected>Coller depuis Nolio</option>
          </select>
        </div>
        <div id="sessionOptions" class="session-options"></div>

        <div class="nolio-input">
          <textarea
            id="sessionInput"
            rows="12"
            spellcheck="false"
            placeholder="Colle ta session ici"
          ></textarea>
          <div class="input-actions">
            <button id="parseBtn">Générer la séance</button>
            <button id="pasteNolioBtn" class="secondary-btn">Coller depuis Nolio</button>
          </div>
        </div>
        <p id="parseStatus" class="status"></p>

        <div class="settings">
          <div class="settings-title">Réglages</div>
          <label class="setting-row">
            <span>Alertes vocales</span>
            <input type="checkbox" id="voiceToggle" checked />
          </label>
          <label class="setting-row" for="voiceMode">
            <span>Voix</span>
            <select id="voiceMode" class="voice-picker">
              <option value="female" selected>Femme</option>
              <option value="male">Homme</option>
            </select>
          </label>
          <label class="setting-row">
            <span>Métronome cadence · 180 BPM</span>
            <input type="checkbox" id="metronomeToggle" />
          </label>
        </div>
      </section>

      <section class="card plan-card">
        <h2>Plan</h2>
        <div id="sessionMeta" class="meta"></div>
        <ol id="exerciseList"></ol>
      </section>

      <section class="card music-card" id="musicCard" style="display:none">
        <h2>Musique</h2>
        <div class="music-genre-row">
          <label for="musicGenre">Genre</label>
          <select id="musicGenre" class="voice-picker">
            <option value="none" selected>Sans musique</option>
            <option value="motown">Motown / Soul</option>
            <option value="hiphop">Hip-hop</option>
            <option value="electro">Électro</option>
            <option value="rock">Rock</option>
            <option value="lofi">Lo-fi / Ambiant</option>
            <option value="myriam">🔥 Spécial Myriam</option>
          </select>
          <label for="musicPlatform">Sur</label>
          <select id="musicPlatform" class="voice-picker">
            <option value="spotify">Spotify</option>
            <option value="apple">Apple Music</option>
            <option value="youtube">YouTube</option>
            <option value="deezer">Deezer</option>
          </select>
        </div>
        <div id="musicTracklist" class="music-tracklist"></div>
        <p class="music-hint">Lance ta musique d'abord, puis appuie sur Démarrer.</p>
      </section>

      <section class="card player-card">
        <h2>Player</h2>
        <div class="phase" id="phaseLabel">Pret</div>
        <div class="countdown" id="countdown">00</div>
        <div class="now" id="currentLabel">Charge une séance</div>
        <div class="next" id="nextLabel"></div>

        <div class="controls">
          <button id="startBtn" class="action-btn" disabled><span class="btn-icon">&#9654;</span>Demarrer</button>
          <button id="pauseBtn" class="action-btn" disabled><span class="btn-icon">&#9208;</span>Pause</button>
          <button id="resetBtn" class="action-btn" disabled><span class="btn-icon">&#9209;</span>Reset</button>
          <button id="skipBlockBtn" class="action-btn"><span class="btn-icon">&#9193;</span>FWD</button>
        </div>
        <div class="controls utility-controls">
          <button id="focusModeBtn" class="secondary-btn">Mode focus</button>
          <button id="wakeLockBtn" class="secondary-btn">Écran actif: off</button>
        </div>
        <div id="appVersion" class="app-version">v1.5.0</div>
      </section>
    </main>

    <script src="music-library.js"></script>
    <script src="sessions-library.js"></script>
    <script src="script.js"></script>
  </body>
</html>
